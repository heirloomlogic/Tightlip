name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Test
        run: swift test

  # Build for iOS Simulator to guard against the plugin tool regressing to macOS-only
  # APIs. Xcode compiles a build-tool plugin's executable (and its source dependencies)
  # for the consuming app's destination platform, so TightlipCore must compile for iOS
  # even though it only ever runs on the host.
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme Tightlip \
            -destination 'generic/platform=iOS Simulator'
