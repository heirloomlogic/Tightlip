name: Tests

# Both triggers are deliberate. This repo squash-merges only, so the commit that
# lands on `main` is a new commit no PR run ever tested — the `push` run is not a
# duplicate of the `pull_request` run. Actions are free on this public repo, so
# there is nothing to save by cutting it.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes, and every one of them runs SwiftPM build-tool plugins
          # after checkout. The token must not sit in `.git/config` where they can
          # read it.
          persist-credentials: false

      - name: Test
        run: swift test

  # Oldest supported toolchain: tools-version 6.1 → Xcode 16.3. Guards against
  # accidentally adopting newer-stdlib API in a published build-tool package.
  # Pinned to macos-15 because macos-latest will eventually drop Xcode 16.3.
  test-macos-floor:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Test
        run: swift test

  # Exercise the actual product — plugin wiring, config-path resolution, tool
  # execution inside a real build — through a standalone consumer package.
  test-fixture:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and run the plugin end to end
        run: |
          cd Fixtures/DemoApp
          swift build
          test "$(./.build/debug/DemoApp)" = "from-env-file"

      - name: Env file edits re-trigger generation without a clean
        run: |
          cd Fixtures/DemoApp
          printf 'export TIGHTLIP_DEMO_KEY=updated-value\n' > Sources/DemoApp/secrets.env
          swift build
          test "$(./.build/debug/DemoApp)" = "updated-value"

  # Build for iOS Simulator to guard against the plugin tool regressing to macOS-only
  # APIs. Xcode compiles a build-tool plugin's executable (and its source dependencies)
  # for the consuming app's destination platform, so TightlipCore must compile for iOS
  # even though it only ever runs on the host.
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme Tightlip \
            -destination 'generic/platform=iOS Simulator'
