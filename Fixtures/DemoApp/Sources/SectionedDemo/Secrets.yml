# Fixture config whose values come only from the build's environment (no env file),
# exercising environment forwarding and section selection. `optionalKey` is set to
# the empty string, which only its `?` marker allows. The access directive follows
# envFile here, the reverse of DemoSecrets' order.
envFile: ./absent.env
access: public
staging:
  demoKey: TIGHTLIP_FIXTURE_STAGING
  optionalKey: TIGHTLIP_FIXTURE_OPTIONAL?
production:
  demoKey: TIGHTLIP_FIXTURE_PRODUCTION
  optionalKey: TIGHTLIP_FIXTURE_OPTIONAL?
